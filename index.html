<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10131c">
    <title>Aayan's Creative Hub</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #10131c;
        color: #f5f6fb;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        background: radial-gradient(ellipse at 50% 0%, #272a46 0, #10131c 58%);
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 72px;
        padding: 16px 24px;
        border-bottom: 1px solid rgb(255 255 255 / 10%);
        background: rgb(16 19 28 / 86%);
        backdrop-filter: blur(14px);
      }

      .topbar h1 {
        margin: 0;
        font-size: 1.15rem;
        letter-spacing: .04em;
      }

      main {
        display: grid;
        min-height: calc(100vh - 72px);
        place-items: center;
        padding: 32px 18px;
      }

      .scroll-frame {
        width: min(100%, 560px);
        max-height: min(680px, calc(100vh - 136px));
        overflow-y: auto;
        padding: 38px 24px;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 28px;
        background: rgb(255 255 255 / 5%);
        box-shadow: 0 24px 80px rgb(0 0 0 / 28%);
      }

      .intro { margin: 0 0 28px; text-align: center; }
      .intro h2 { margin: 0 0 8px; font-size: clamp(1.5rem, 5vw, 2rem); }
      .intro p { margin: 0; color: #b6bbcd; }

      .button-list {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .hub-button {
        width: min(100%, 360px);
        min-height: 64px;
        padding: 16px 22px;
        border: 1px solid rgb(255 255 255 / 15%);
        border-radius: 18px;
        background: #202438;
        color: inherit;
        font: inherit;
        font-size: 1.05rem;
        font-weight: 650;
        text-align: left;
        cursor: pointer;
        transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
      }

      .hub-button:hover, .hub-button[aria-expanded="true"] {
        transform: translateY(-2px);
        border-color: #9c8cff;
        background: #2b2d49;
      }

      .hub-button:focus-visible { outline: 3px solid #b2a7ff; outline-offset: 3px; }

      .detail {
        width: min(100%, 360px);
        margin: 0;
        padding: 0 18px;
        color: #c8cce0;
        line-height: 1.6;
      }

      .detail[hidden] { display: none; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <h1>Aayan's Creative Hub</h1>
    </header>

    <main>
      <section class="scroll-frame" aria-labelledby="welcome-title">
        <div class="intro">
          <h2 id="welcome-title">Pick a corner</h2>
          <p>Choose a button to explore what I'm into.</p>
        </div>

        <div class="button-list">
          <button class="hub-button" type="button" aria-expanded="false" aria-controls="coding-detail">💻 &nbsp; Coding</button>
          <p class="detail" id="coding-detail" hidden>Projects, experiments, and things I'm learning to build.</p>

          <button class="hub-button" type="button" aria-expanded="false" aria-controls="editing-detail">🎬 &nbsp; Editing</button>
          <p class="detail" id="editing-detail" hidden>Video edits and creative ideas will go here.</p>

          <button class="hub-button" type="button" aria-expanded="false" aria-controls="playing-detail">🎮 &nbsp; Playing</button>
          <p class="detail" id="playing-detail" hidden>Games and other things I enjoy playing.</p>
        </div>
      </section>
    </main>

    <script>
      document.querySelectorAll('.hub-button').forEach((button) => {
        button.addEventListener('click', () => {
          const detail = document.getElementById(button.getAttribute('aria-controls'));
          const isOpen = button.getAttribute('aria-expanded') === 'true';
          button.setAttribute('aria-expanded', String(!isOpen));
          detail.hidden = isOpen;
        });
      });
    </script>
  </body>
</html>
